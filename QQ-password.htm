<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速云平台 - QQ群验证码获取</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(90deg, #3498db, #2c3e50);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        
        .logo-inner {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border-radius: 8px;
            position: relative;
        }
        
        .logo-inner::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 4px;
            top: 10px;
            left: 10px;
        }
        
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .subtitle {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .rules-section {
            margin-bottom: 25px;
        }
        
        h2 {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .rule-item {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #3498db;
            border-radius: 4px;
            margin-right: 10px;
            position: relative;
            transition: all 0.3s;
        }
        
        .checkbox.checked::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .checkbox.checked {
            background: #3498db;
        }
        
        .rule-text {
            font-size: 0.95rem;
            color: #34495e;
            line-height: 1.5;
        }
        
        .captcha-section {
            margin-top: 30px;
        }
        
        .captcha-box {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .captcha-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        
        .captcha-code {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: #2c3e50;
            font-weight: bold;
            padding: 10px 15px;
            background: white;
            border-radius: 6px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            border: 1px solid #e1e5e9;
        }
        
        .join-btn {
            display: inline-block;
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 3px 5px rgba(39, 174, 96, 0.3);
        }
        
        .join-btn:hover {
            background: #219653;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(39, 174, 96, 0.4);
        }
        
        .human-verify {
            margin-top: 30px;
            text-align: center;
        }
        
        .verify-title {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .verify-area {
            width: 200px;
            height: 60px;
            background: #f8f9fa;
            border: 1px dashed #bdc3c7;
            border-radius: 8px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .verify-area:hover {
            border-color: #3498db;
            background: #f0f7ff;
        }
        
        .verify-text {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .verify-check {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #27ae60;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .check-mark {
            width: 12px;
            height: 6px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-top: -3px;
        }
        
        .verify-loading {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .verify-message {
            font-size: 0.9rem;
            margin-top: 10px;
            min-height: 20px;
        }
        
        .success {
            color: #27ae60;
        }
        
        .error {
            color: #e74c3c;
        }
        
        .hidden {
            display: none;
        }
        
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #95a5a6;
            border-top: 1px solid #eee;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-inner"></div>
            </div>
            <h1>极速云平台官方QQ群验证</h1>
            <p class="subtitle">尊敬的用户您好，为保证群聊安全防护，请您完成以下验证</p>
        </div>
        
        <div class="content">
            <div class="rules-section">
                <h2>请确认以下事项</h2>
                
                <div class="rule-item">
                    <div class="checkbox-container" onclick="toggleCheckbox(this)">
                        <div class="checkbox"></div>
                    </div>
                    <div class="rule-text">您是否愿意遵守群规则</div>
                </div>
                
                <div class="rule-item">
                    <div class="checkbox-container" onclick="toggleCheckbox(this)">
                        <div class="checkbox"></div>
                    </div>
                    <div class="rule-text">您是否保证不违反中华人民共和国所规定的法律</div>
                </div>
            </div>
            
            <div class="human-verify">
                <div class="verify-title">完成人机验证</div>
                <div class="verify-area" id="verifyArea" onclick="startVerification(event)">
                    <div class="verify-text">点击此处验证</div>
                    <div class="verify-loading" id="verifyLoading"></div>
                    <div class="verify-check" id="verifyCheck">
                        <div class="check-mark"></div>
                    </div>
                </div>
                <div class="verify-message" id="verifyMessage"></div>
            </div>
            
            <div class="captcha-section hidden" id="captchaSection">
                <div class="captcha-box">
                    <div class="captcha-label">验证码</div>
                    <div class="captcha-code" id="captchaCode">621066</div>
                    <a href="#" class="join-btn">点击加入QQ群</a>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>极速云平台 &copy; 2026 - 安全验证系统</p>
        </div>
    </div>

    <script>
        let checkboxesChecked = 0;
        let verificationStarted = false;
        let verificationCompleted = false;
        
        function toggleCheckbox(element) {
            const checkbox = element.querySelector('.checkbox');
            
            if (checkbox.classList.contains('checked')) {
                checkbox.classList.remove('checked');
                checkboxesChecked--;
            } else {
                checkbox.classList.add('checked');
                checkboxesChecked++;
            }
            
            // 如果两个复选框都已选中，启用验证区域
            updateVerifyArea();
        }
        
        function updateVerifyArea() {
            const verifyArea = document.getElementById('verifyArea');
            const verifyText = verifyArea.querySelector('.verify-text');
            
            if (checkboxesChecked === 2) {
                verifyArea.style.cursor = 'pointer';
                verifyText.textContent = '点击此处验证';
                verifyArea.style.borderStyle = 'solid';
                verifyArea.style.borderColor = '#3498db';
                verifyArea.style.background = '#f0f7ff';
            } else {
                verifyArea.style.cursor = 'not-allowed';
                verifyText.textContent = '请先确认以上事项';
                verifyArea.style.borderStyle = 'dashed';
                verifyArea.style.borderColor = '#bdc3c7';
                verifyArea.style.background = '#f8f9fa';
                verificationStarted = false;
            }
        }
        
        function startVerification(event) {
            // 如果两个复选框未选中，不执行验证
            if (checkboxesChecked < 2) {
                return;
            }
            
            // 防止重复验证
            if (verificationStarted) {
                return;
            }
            
            verificationStarted = true;
            const verifyArea = document.getElementById('verifyArea');
            const verifyText = verifyArea.querySelector('.verify-text');
            const verifyLoading = document.getElementById('verifyLoading');
            const verifyCheck = document.getElementById('verifyCheck');
            const verifyMessage = document.getElementById('verifyMessage');
            
            // 隐藏文本，显示加载动画
            verifyText.style.display = 'none';
            verifyLoading.style.display = 'block';
            verifyMessage.textContent = '正在验证您是否为真人...';
            verifyMessage.className = 'verify-message';
            
            // 获取点击位置
            const rect = verifyArea.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            
            // 模拟验证过程
            setTimeout(() => {
                verifyLoading.style.display = 'none';
                
                // 判断点击位置是否在中心区域
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const distance = Math.sqrt(Math.pow(clickX - centerX, 2) + Math.pow(clickY - centerY, 2));
                
                if (distance < 30) { // 中心区域半径为30px
                    // 验证失败
                    verifyMessage.textContent = '对不起，您未完成人机验证。';
                    verifyMessage.className = 'verify-message error';
                    verificationStarted = false;
                } else {
                    // 验证成功
                    verifyCheck.style.display = 'flex';
                    verifyMessage.textContent = '恭喜您已完成人机验证';
                    verifyMessage.className = 'verify-message success';
                    verificationCompleted = true;
                    
                    // 显示验证码
                    setTimeout(() => {
                        document.getElementById('captchaSection').classList.remove('hidden');
                    }, 800);
                }
            }, 1500);
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateVerifyArea();
        });
    </script>
</body>
</html>
